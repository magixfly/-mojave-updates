<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Carlin Box</title>
<link rel="stylesheet" href="leaflet.css">
<style>
html,body{margin:0;height:100%;background:#0b0f14;color:#e5e7eb;font:700 19px/1.2 system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#top{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:10px;padding:0 10px;box-sizing:border-box;background:#0b0f14;z-index:1000}
.pill{height:46px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid rgba(77,184,255,.6);border-radius:10px;padding:0 14px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
#title{color:#4ade80;font-size:24px;letter-spacing:1px;padding-right:6px}
#title small{display:block;color:#9ca3af;font-size:14px;font-weight:400;letter-spacing:0}
#net{width:300px;color:#4ade80}
#maps{position:relative;width:360px;padding:0;cursor:pointer;background:#1f2937}
/* 2.08: top bar never wraps or jumps - fixed widths, smaller text in the pills */
#top>*{flex:none}#top>.sp{flex:1 1 0;min-width:0}#title{white-space:nowrap}#top .pill{font-size:20px;flex:0 1 auto;min-width:0}#top #menuB{flex:none}#net{width:240px}#maps{width:320px}#gps{width:280px}#car{width:460px}#car:empty,#fpvs:empty{display:none}
#mapsBar{position:absolute;left:0;top:0;bottom:0;background:#166534;width:0;transition:width .5s}
#mapsT{position:relative;color:#f3f4f6;text-shadow:0 0 3px #000,0 0 3px #000}
#maps.on #mapsBar{background:#16a34a}
#gps{width:300px;color:#9ca3af}
#fpvs{color:#93c5fd;display:none}
#car{color:#9ca3af;display:none}#car b{font-weight:700}
.mj{position:relative;width:0;height:0}
.mj i{position:absolute;left:-15px;top:-15px;width:24px;height:24px;border-radius:50%;background:#4db8ff;border:3px solid #fff;box-shadow:0 0 10px rgba(0,0,0,.7)}
.mj b{position:absolute;left:-12px;top:-42px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:24px solid #4db8ff;transform-origin:12px 42px}
.mj.old i,.mj.old b{opacity:.45}
.atip{background:rgba(11,15,20,.85)!important;color:#e5e7eb!important;border:1px solid #4db8ff!important;font:700 14px system-ui!important;box-shadow:none!important}
.sp{flex:1}
#menuB{width:64px;font-size:28px;color:#4ade80;cursor:pointer}
#menu{position:absolute;right:10px;top:66px;z-index:1100;background:#111827;border:2px solid rgba(77,184,255,.6);border-radius:12px;padding:8px;display:none;flex-direction:column;gap:8px;min-width:300px}
#menu.open{display:flex}
#menu button{font:700 22px system-ui,sans-serif;color:#e5e7eb;background:#0b0f14;border:2px solid #374151;border-radius:10px;padding:16px;text-align:left}
#upd{position:relative;height:40px;border-radius:8px;background:#1f2937;display:none;overflow:hidden}#updBar{position:absolute;left:0;top:0;bottom:0;width:0;background:#16a34a;transition:width .5s}#updT{position:relative;display:block;line-height:40px;padding:0 10px;font-size:16px;color:#f3f4f6;text-shadow:0 0 3px #000}
#menu .info{color:#9ca3af;font-size:16px;font-weight:400;padding:4px 6px}
#map{position:absolute;left:0;right:0;top:60px;bottom:0;background:#0b0f14;overflow:hidden}
/* 2.12: frame with speed and battery while the Mojave sends data */
#mjf{position:absolute;left:16px;bottom:16px;z-index:950;width:250px;padding:10px 14px 12px;border-radius:16px;background:rgba(11,15,20,.88);border:2px solid rgba(77,184,255,.7);display:none;font-variant-numeric:tabular-nums;box-shadow:0 4px 16px rgba(0,0,0,.6)}
#mjf.old{border-color:#f5b13d;opacity:.8}#mjf .h{color:#93c5fd;font:800 16px system-ui;letter-spacing:1px;display:flex;justify-content:space-between}
#mjf .sp{color:#fff;font:800 64px/1 system-ui;margin:4px 0 8px}#mjf .sp small{font-size:20px;color:#9ca3af;margin-left:6px;font-weight:600}
#mjf .bat{position:relative;height:30px;border-radius:9px;background:#1f2937;overflow:hidden}#mjf .bat i{position:absolute;left:0;top:0;bottom:0;width:0;background:#16a34a;transition:width .5s}
#mjf .bat span{position:absolute;inset:0;text-align:center;font:800 18px/30px system-ui;color:#fff;text-shadow:0 1px 2px #000}#mjf .ft{color:#9ca3af;font:600 14px system-ui;margin-top:6px}
#mapi{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
html.ms #mapi .leaflet-marker-icon>*{scale:1.2625}html.ms #mapi .leaflet-tooltip{font-size:15px;padding:5px 8px}html.ms #mapi .leaflet-control-attribution{font-size:14px}   /* 2.11: markers and labels keep their size */   /* 2.10: map drawn 1:1 in screen pixels (box density 1.26 made light seams) */
#btns{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:900;display:flex;flex-direction:column;gap:14px}
.b{width:84px;height:84px;border-radius:18px;background:rgba(11,15,20,.85);border:2px solid rgba(77,184,255,.6);color:#4ade80;font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.b.act{background:#166534;color:#fff}
/* 2.10: no oversized tiles - Leaflet 1.9 blends tile edges with plus-lighter, overlapping tiles gave bright lines */.leaflet-container,#map{background:#1a1f24!important}   /* 2.09: seams between tiles showed the light grey Leaflet background */
.leaflet-control-attribution{font-size:11px!important;background:rgba(11,15,20,.6)!important;color:#9ca3af!important}
.leaflet-control-attribution a{color:#9ca3af!important}
.me{position:relative;width:0;height:0}
.me i{position:absolute;left:-13px;top:-13px;width:20px;height:20px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 8px rgba(0,0,0,.6)}
.me b{position:absolute;left:-12px;top:-38px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:22px solid #3b82f6;transform-origin:12px 38px;display:none}
#nopos{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:900;background:rgba(11,15,20,.8);border-radius:10px;padding:8px 16px;color:#9ca3af;font-size:16px;font-weight:400}
html.ctsplit #car{display:none!important}html.ctsplit #net{width:220px}html.ctsplit #gps,html.ctsplit #title small{display:none}html.ctsplit #maps{width:240px}
</style></head><body>
<div id="top">
  <div id="title">CARLIN BOX<small id="ver"></small></div>
  <div class="pill" id="net" title="Box Wi-Fi">…</div>
  <div class="pill" id="maps" title="Tap: start / stop the map download"><div id="mapsBar"></div><span id="mapsT">Maps</span></div>
  <div class="pill" id="gps">No GPS</div>
  <div class="pill" id="car" title="Mojave via the tracker ESP (Bluetooth)"></div>
  <div class="pill" id="fpvs"></div>
  <div class="sp"></div>
  <div class="pill" id="menuB">&#8943;</div>
</div>
<div id="menu">
  <button id="mFollow">Follow position: on</button>
  <button id="mOvl">Place names: on</button>
  <button id="mCar">Show Mojave: on</button>
  <button id="mBle">Bluetooth ESP: on</button>
  <div class="info" id="bleT">Bluetooth: –</div>
  <button id="mUpd">Check for update</button>
  <div id="upd"><div id="updBar"></div><span id="updT"></span></div>
  <button id="mAuto">Box settings (Autostart)</button>
  <button id="mRe">Restart app</button>
  <button id="mCl">Close app</button>
  <div class="info" id="mInfo"></div>
</div>
<div id="map"><div id="mapi"></div></div>
<div id="mjf"><div class="h">MOJAVE <span id="mjfLq"></span></div><div class="sp"><span id="mjfKmh">0</span><small>km/h</small></div>
<div class="bat"><i id="mjfBar"></i><span id="mjfBat">–</span></div><div class="ft" id="mjfFt"></div></div>
<div id="btns"><div class="b" id="zin">+</div><div class="b" id="zout">&minus;</div><div class="b" id="ctr" title="Center on own position">&#8982;</div><div class="b" id="areasB" title="Show the shared map areas" style="font-size:17px;font-weight:800">AREAS</div></div>
<div id="nopos">No position from the box – map shows home</div>
<script src="leaflet.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
function cmd(c){fetch('/__ctbox/'+c).catch(function(){});}
function ls(k,d){try{var v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
function lw(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var home=[48.1874,15.6139];
var DPR=window.devicePixelRatio||1,MS=Math.abs(DPR-Math.round(DPR))>.01;   // 2.11: map 1:1 in screen pixels again (no seams at density 1.26)
if(MS)document.documentElement.classList.add('ms');
function fitMap(){var w=document.getElementById('map'),m=document.getElementById('mapi');if(!MS)return;var r=w.getBoundingClientRect(),fx=(r.left*DPR)%1,fy=(r.top*DPR)%1;   // 2.12: start on a whole screen pixel
 m.style.left=(-fx/DPR)+'px';m.style.top=(-fy/DPR)+'px';m.style.width=(w.clientWidth*DPR+2)+'px';m.style.height=(w.clientHeight*DPR+2)+'px';m.style.transform='scale('+(1/DPR)+')'}
fitMap();
var map=L.map('mapi',{zoomControl:false,attributionControl:true,maxZoom:20,minZoom:7,zoomSnap:1,inertia:true,
  maxBounds:[[46.3,13.0],[49.6,18.3]]});
map.attributionControl.setPrefix(false);
L.tileLayer('/tile/{z}/{x}/{y}.jpg',{maxNativeZoom:19,maxZoom:20,minZoom:7,attribution:'basemap.at',keepBuffer:4}).addTo(map);
var ovl=L.tileLayer('/ovl/{z}/{x}/{y}.png',{maxNativeZoom:19,maxZoom:20,minZoom:7});
var ovlOn=ls('ovl','1')=='1';if(ovlOn)ovl.addTo(map);
var v0=JSON.parse(ls('view','null')||'null');
if(v0)map.setView([v0[0],v0[1]],v0[2]);else map.setView(home,13);
map.on('moveend',function(){var c=map.getCenter();lw('view',JSON.stringify([c.lat,c.lng,map.getZoom()]));});
var follow=ls('follow','1')=='1',me=null,pos=null;
function setFollow(f){follow=f;lw('follow',f?'1':'0');$('ctr').classList.toggle('act',f);$('mFollow').textContent='Follow position: '+(f?'on':'off');if(f&&pos)map.panTo(pos);}
setFollow(follow);
map.on('dragstart',function(){if(follow)setFollow(false);});
$('zin').onclick=function(){map.zoomIn();};
$('zout').onclick=function(){map.zoomOut();};
$('ctr').onclick=function(){if(pos){setFollow(true);map.setView(pos,Math.max(map.getZoom(),16));}else map.setView(home,15);};
$('maps').onclick=function(){cmd('toggle');};
$('menuB').onclick=function(e){e.stopPropagation();$('menu').classList.toggle('open');};
map.on('click',function(){$('menu').classList.remove('open');});
$('mFollow').onclick=function(){setFollow(!follow);};
$('mOvl').onclick=function(){ovlOn=!ovlOn;lw('ovl',ovlOn?'1':'0');if(ovlOn)ovl.addTo(map);else map.removeLayer(ovl);this.textContent='Place names: '+(ovlOn?'on':'off');};
$('mOvl').textContent='Place names: '+(ovlOn?'on':'off');
$('mUpd').onclick=function(){cmd('update');$('upd').style.display='block';$('updT').textContent='Checking for update …';};
$('mAuto').onclick=function(){$('menu').classList.remove('open');cmd('autostart');};
$('mRe').onclick=function(){cmd('restart');};
$('mCl').onclick=function(){cmd('close');};
/* --- called by the app --- */
window.ctInit=function(ver,lat,lon,ble){home=[lat,lon];$('ver').textContent='V'+ver;$('mInfo').textContent='Carlin Box V'+ver+' · maps from the shared area list (box memory)';$('mBle').textContent='Bluetooth ESP: '+(ble?'on':'off')+' (restarts app)';};
/* --- V2.07: AREAS button - areas of the shared list (gebiete.json) as overlay --- */
var areasOn=ls('areas','0')=='1',areasL=L.layerGroup(),areasVer=null;
function areasDraw(j){areasL.clearLayers();(j.areas||[]).forEach(function(a){
  var lab=(a.name||a.id||'area')+' · zoom '+(a.zmax||16),col=a.auto?'#f59e0b':'#4db8ff',l=null;
  if(a.type=='circle')l=L.circle([a.lat,a.lon],{radius:a.r,color:col,weight:2,fillColor:col,fillOpacity:.15,interactive:false});
  else if(a.type=='rect')l=L.rectangle([[a.s,a.w],[a.n,a.e]],{color:col,weight:2,fillColor:col,fillOpacity:.15,interactive:false});
  else if(a.type=='route'&&a.pts)l=L.polyline(a.pts,{color:'#a855f7',weight:12,opacity:.35,lineCap:'round',lineJoin:'round',interactive:false});
  if(l){l.bindTooltip(lab,{permanent:true,direction:'center',className:'atip',opacity:.9});areasL.addLayer(l);}});areasFill();}
// 2.13: fill only when the area is smaller than the screen - inside a big area the map stayed tinted (looked pale)
function areasFill(){var sz=map.getSize();areasL.eachLayer(function(l){if(!l.getBounds||!l.setStyle||l instanceof L.Polyline&&!(l instanceof L.Polygon)&&!(l instanceof L.Circle))return;var b=l instanceof L.Circle?l.getLatLng().toBounds(l.getRadius()*2):l.getBounds(),p1=map.latLngToContainerPoint(b.getNorthWest()),p2=map.latLngToContainerPoint(b.getSouthEast());var big=Math.abs(p2.x-p1.x)>sz.x*.6||Math.abs(p2.y-p1.y)>sz.y*.6;l.setStyle({fillOpacity:big?0:.1});});}
map.on('zoomend',areasFill);
function areasLoad(){fetch('/__ctbox/areas?t='+Date.now()).then(function(r){return r.json();}).then(function(j){if(j.ver!==areasVer||!areasL.getLayers().length){areasVer=j.ver;areasDraw(j);}}).catch(function(){});}
function setAreas(on){areasOn=on;lw('areas',on?'1':'0');$('areasB').classList.toggle('act',on);if(on){areasLoad();areasL.addTo(map);}else map.removeLayer(areasL);}
$('areasB').onclick=function(){setAreas(!areasOn);};
setAreas(areasOn);setInterval(function(){if(areasOn)areasLoad();},60000);
/* --- V2.06: Mojave from the tracker ESP via Bluetooth --- */
var car=null,carOn=ls('car','1')=='1',carFollow=false;
$('mCar').textContent='Show Mojave: '+(carOn?'on':'off');
$('mCar').onclick=function(){carOn=!carOn;lw('car',carOn?'1':'0');this.textContent='Show Mojave: '+(carOn?'on':'off');if(car&&!carOn){map.removeLayer(car);car=null;}$('car').style.display=carOn&&car?'flex':'none';};
$('mBle').onclick=function(){cmd('ble');};
window.ctEsp=function(st,name,age,rssi,pps){$('bleT').textContent='Bluetooth: '+st+(name?' · '+name:'')+(st=='connected'&&age>=0?' · data '+age+' s ago':'')+(pps?' · ESP '+pps+' pkt/s'+(rssi?' '+rssi+' dBm':''):'');
  if(st!='connected'&&car){car.getElement()&&car.getElement().firstChild.classList.add('old');}};
var mjfT=0;setInterval(function(){if(Date.now()-mjfT>10000)$('mjf').style.display='none'},2000);
window.ctCar=function(lat,lon,kmh,hdg,sats,volt,pct,mah,lq,rssi,mode,age){
  if(!carOn)return;var e=$('car');e.style.display='flex';
  // 2.12: frame bottom left - speed big, battery bar with % and volt, LQ
  if(age<=10){mjfT=Date.now();var f=$('mjf');f.style.display='block';f.classList.toggle('old',age>5||(lq>=0&&lq<50));
   $('mjfKmh').textContent=lat!=null?Math.round(kmh):'–';var p=pct>=0&&pct<=100?pct:null;
   $('mjfBar').style.width=(p==null?0:p)+'%';$('mjfBar').style.background=p==null?'#374151':p>40?'#16a34a':p>20?'#d97706':'#dc2626';
   $('mjfBat').textContent=(p!=null?p+' % · ':'')+(volt>0?volt.toFixed(1)+' V':'–');
   $('mjfLq').textContent=lq>=0?'LQ '+lq:'';$('mjfLq').style.color=lq>=0&&lq<50?'#f5b13d':'#4ade80';
   $('mjfFt').textContent=(lat!=null?(sats>0?sats+' sats':'GPS'):'no GPS')+(mah>0?' · '+Math.round(mah)+' mAh':'')+(mode?' · '+mode:'')}
  e.innerHTML='<b>MOJAVE</b> '+(lat!=null?Math.round(kmh)+' km/h':'no GPS')+(volt>0?' · '+volt.toFixed(1)+' V':'')+(pct>=0&&pct<=100?' '+pct+' %':'')+(lq>=0?' · LQ '+lq:'');
  e.style.color=(lq>=0&&lq<50)||age>5?'#f5b13d':'#4ade80';
  if(lat==null||(lat==0&&lon==0))return;
  if(!car)car=L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div class="mj"><b></b><i></i></div>',iconSize:[0,0]}),interactive:false,zIndexOffset:1000}).addTo(map);
  else car.setLatLng([lat,lon]);
  var el=car.getElement()&&car.getElement().firstChild;if(el){el.classList.toggle('old',age>5);el.querySelector('b').style.transform='rotate('+hdg+'deg)';el.querySelector('b').style.display=kmh>2?'block':'none';}
};
window.ctNet=function(t){var e=$('net');e.textContent=t||'…';var m=(t||'').match(/(-\d+) dBm/),r=m?+m[1]:0;e.style.color=!m?'#4ade80':r>=-60?'#4ade80':r>=-72?'#f5b13d':'#f87171';};
window.ctMaps=function(pct,mb,st,on){$('mapsBar').style.width=pct+'%';$('mapsT').textContent='Maps '+pct+' % · '+(st=='complete'?'✓':st);$('maps').classList.toggle('on',!!on);$('maps').title=mb+' · tap: start / stop';};
window.ctPos=function(lat,lon,acc,kmh,brg,age,gps){
  pos=[lat,lon];$('nopos').style.display='none';
  if(!me){me=L.marker(pos,{icon:L.divIcon({className:'',html:'<div class="me"><b></b><i></i></div>',iconSize:[0,0]}),interactive:false}).addTo(map);}
  else me.setLatLng(pos);
  var a=me.getElement()&&me.getElement().querySelector('b');
  if(a){var mv=kmh>3&&brg>=0;a.style.display=mv?'block':'none';if(mv)a.style.transform='rotate('+brg+'deg)';}
  $('gps').textContent=(gps?'GPS':'Pos. via Wi-Fi')+(acc>0?' ±'+Math.round(acc)+' m':'')+(kmh>=0&&gps?' · '+Math.round(kmh)+' km/h':'')+(age>30?' · old':'');
  $('gps').style.color=age>30?'#f5b13d':'#4ade80';
  if(follow)map.panTo(pos,{animate:true,duration:.5});
};
window.ctUpd=function(t,p){var u=$('upd');if(!t){return;}u.style.display='block';$('updT').textContent=t+(p>=0&&p<100?' '+p+' %':'');$('updBar').style.width=(p<0?0:p)+'%';};
window.ctFpvSet=function(fps,mbit,buf,dec){var e=$('fpvs');e.style.display='flex';e.textContent='FPV '+Math.round(fps)+' fps'+(mbit!=null?' · '+(+mbit).toFixed(1)+' Mbit/s':'');clearTimeout(window.ctFpvT);window.ctFpvT=setTimeout(function(){e.style.display='none';},6000);};
new MutationObserver(function(){setTimeout(function(){fitMap();map.invalidateSize();},50);}).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
window.addEventListener('resize',function(){fitMap();map.invalidateSize();});
// 2.10: mouse wheel from the remote page (screen pixels 1920x720)
window.ctWheel=function(d,x,y){var r=document.getElementById('mapi').getBoundingClientRect();var cx=(x/DPR-r.left)*(MS?DPR:1),cy=(y/DPR-r.top)*(MS?DPR:1);
 if(cx<0||cy<0)return;map.setZoomAround(map.containerPointToLatLng([cx,cy]),Math.max(map.getMinZoom(),Math.min(map.getMaxZoom(),map.getZoom()+d)))};
</script>
</body></html>
